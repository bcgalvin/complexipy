[changelog]
header = """
# Changelog

Generated from this fork's commits after upstream `5c52836`.
Do not edit by hand. See [changelog maintenance](docs/changelog.md).
"""
body = '''
{%- if commits | length > 0 -%}
## {% if version %}{{ version }}{% else %}Unreleased{% endif %}
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
### {{ entry.group }}
{% for commit in entry.commits %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}{{ commit.message | split_regex(pat="\n") | first }} (`{{ commit.id | truncate(length=7, end="") }}`)
{% if commit.breaking_description %}  Breaking change: {{ commit.breaking_description | trim | replace(from="
", to="
  ") }}
{% endif -%}
{% endfor -%}
{% endfor %}
{% endif -%}
'''
trim = false
render_always = false
postprocessors = [{ pattern = '\n+\z', replace = "\n" }]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_preprocessors = []
commit_parsers = [
    { field = "breaking", pattern = "true", group = "Breaking changes" },
    { message = '^chore\(release\): (refresh changelog|prepare [0-9]+\.[0-9]+\.[0-9]+)(\r?\n|$)', skip = true },
    { message = '^feat(\(|:)', group = "Features" },
    { message = '^fix(\(|:)', group = "Fixes" },
    { message = '^perf(\(|:)', group = "Performance" },
    { message = '^refactor(\(|:)', group = "Refactoring" },
    { message = '^docs(\(|:)', group = "Documentation" },
    { message = '^test(\(|:)', group = "Tests" },
    { message = '^(build|ci|chore|style)(\(|:)', group = "Maintenance" },
    { message = '^revert(\(|:)', group = "Reverts" },
    { message = ".*", group = "Other" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
tag_pattern = '^[0-9]+\.[0-9]+\.[0-9]+$'
topo_order = true
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
