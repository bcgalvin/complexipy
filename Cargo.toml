[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "9.0.0"
edition = "2024"
authors = ["Bryan Galvin"]
license = "MIT"
homepage = "https://github.com/bcgalvin/complexipy"
repository = "https://github.com/bcgalvin/complexipy"

[workspace.lints.rust]
unsafe_code = "forbid"
unnameable_types = "warn"
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
format_collect = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
exit = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
panic = "warn"
unreachable = "warn"
mod_module_files = "warn"
iter_over_hash_type = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
print_stdout = "warn"
print_stderr = "warn"
string_slice = "warn"

[workspace.dependencies]
ruff_python_parser = { git = "https://github.com/astral-sh/ruff.git", rev = "ef422460de726c5b896c09c364d02a4db24bcaf0", package = "ruff_python_parser" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff.git", rev = "ef422460de726c5b896c09c364d02a4db24bcaf0", package = "ruff_python_ast" }
regex = "1.11.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3.0"
ignore = "0.4.22"
wax = "0.7.0"
rayon = "1.10"
pyo3 = "0.29"
crossbeam-channel = "0.5"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
toml = "1.1.4"
clap = { version = "4.6.6", features = ["derive"] }
blake2 = "0.10"
sha2 = "0.10"
comfy-table = "8.0"
owo-colors = "4.3"
syntect = "5.3"
terminal_size = "0.4"
unicode-width = "0.2"
tempfile = "3.10.0"
