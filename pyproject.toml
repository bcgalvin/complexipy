[build-system]
requires = ["maturin>=1.9.4,<2.0"]
build-backend = "maturin"

[project]
name = "complexipy"
description = "Cognitive complexity analysis for Python, maintained for recsys-code-quality."
readme = "README.md"
license = { text = "MIT" }
authors = [{name = "Bryan Galvin"}]
requires-python = ">=3.14"
dynamic = ["version"]

dependencies = []

[project.scripts]
complexipy = "complexipy.cli:main"

[project.urls]
Repository = "https://github.com/bcgalvin/complexipy"

[tool.maturin]
manifest-path = "crates/complexipy-python/Cargo.toml"
module-name = "complexipy._complexipy"
bindings = "pyo3"
include = ["LICENSE"]

[tool.complexipy]
paths = ["crates", "complexipy"]
max-complexity-allowed = 15
quiet = true
ignore-complexity = false
failed = true
sort = "asc"
output-format = []

[tool.uv]
cache-keys = [
    {file = "pyproject.toml"},
    {file = "Cargo.toml"},
    {file = "Cargo.lock"},
    {file = "crates/*/Cargo.toml"},
    {file = "**/*.rs"},
]

[tool.ruff]
line-length = 80
indent-width = 4
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
exclude = ["tests/src/**", "tests/fixtures/**"]

[tool.ruff.format]
exclude = ["tests/fixtures/**", "tests/src/**"]

[tool.yamlfix]
explicit_start = true
line_length = 120
whitelines = 1
comments_whitelines = 1
section_whitelines = 1
comments_min_spaces_from_content = 2
comments_require_starting_space = true
preserve_quotes = true
sequence_style = "keep_style"

[tool.ty.src]
exclude = ["tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"
possibly-missing-attribute = "error"
unused-ignore-comment = "error"
redundant-cast = "error"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "maturin>=1.8.3",
    "pre-commit>=3.5.0",
    "pytest>=8.3.5",
    "ruff>=0.9.0",
    "ty>=0.0.1a1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "main.py"]
python_functions = ["test_*"]
norecursedirs = ["tests/src"]
